  <body>
    <div id="container"></div>
    <script>


      let students=[
      {name:'john',marks:80},
      {name:'janu',marks:50},

      let output=`

        <div>${i.marks}</div>
        <p>${grade}</p>
      </div>
        `

        container.innerHTML+=output


      }
