<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- units -->
     <style>
        /* 
        units
        absolute units
        px 
        cm
        mm
        inch

        relative units
        %- it always depends on parent
        vw and vh - 
        viewport width - it always depnds on the view port screen
        viewport height - it always depnds on the view port screen

        rem -root element--by defalut it was having 16px
        html{
        //we can change 
        font-size:28px;
        }
        
        div{
            background:yellow;
            padding:10px;
            width:50%;
            height:500px;
            width:50vw;
            height:100vh;
        }
        p{
            background:blue;

            width:50%;
   height:50%;
            width:80vw;
            height:50vh;
            font-size :2rem
        }
        html{
            font-size:10px;
        }


        */

        /*
        
        flexbox 
        it is used to create one dimensional layouts
        navbar,cards, sections
        it has flexcontainer properetis(parent) and flexitem (child
        properties)


        flex parent properites
        1) 
        display:flex;
        it will change direcction of flex items to single row
        it will create flex container

        2) it is used to change the diretion of flex items
         flex-direction:column;
            flex-direction:row;
            flex-direction:row-reverse;
            flex-direction:column-reverse;

     3) justify-content
     it is used to control the child items on main axis
  justify-content:space-between;
            justify-content:space-evenly;
            justify-content:space-around;
            justify-content:start;
            justify-content:end;
            justify-content:center;

    4) align items 
    it is used to control the child items on cross axis
     align-items:end;
            align-items:start;
            align-items:center;
    5) flex-wrap -it is used to wrap the items into the next row
    flex-wrap:wrap
    flex-wrap:wrap-reverse;

    6) it is usedd to control the child items on cross axis when there is a more than
    one row
      align-content:center;
            align-content:start;
            align-content:end;
            align-content:space-between;
            align-content:space-evenly;
            align-content:space-around;

    7) flex-flow
it is a combination of flex wrap and flex direction
    flex-flow:wrap reverse;
    flex-flow:wrap coluumn-reverse;


    child properties
    1) flex basis
    it specifies the initial width of a child item
    flex-basis:30%;
        */
        .parent{
            display:flex;
            /* flex-direction:column;
            flex-direction:row;
            flex-direction:row-reverse;
            flex-direction:column-reverse; */
            justify-content:space-between;
            justify-content:space-evenly;
            justify-content:space-around;
            justify-content:start;
            justify-content:end;
            justify-content:center;
            height:100vh;
            /* align-items:end;
            align-items:start;
            align-items:center; */
            flex-wrap:wrap-reverse;
            align-content:center;
            align-content:start;
            align-content:end;
            align-content:space-between;
            align-content:space-evenly;
            align-content:space-around;

        }
        .child{
            background:rgb(225, 8, 127);
            padding:20px;
            border:2px solid ;
              flex-basis:30%;

        }
     </style>
</head>
<body>
    <!-- <div>content <p>paragraph</p></div> -->
    <div class="parent">
        <div class="child">child1</div>
        <div class="child">child2</div>
        <div class="child">child3</div>
        <div class="child">child4</div>
         <div class="child">child1</div>
        <div class="child">child2</div>
        <div class="child">child3</div>
        <div class="child">child4</div>
    </div>
</body>
</html>
